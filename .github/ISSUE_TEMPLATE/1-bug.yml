name: Bug report
description: Report a problem with Extended Commander
body:
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Include emcx --version, operating system, terminal and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the steps, expected result and actual result. Use disposable test files for file operation problems.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional information
      description: Include relevant logs or screenshots. If tested, mention whether it also happens with a clean emcx profile or upstream Midnight Commander.
